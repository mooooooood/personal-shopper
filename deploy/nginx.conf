# Replace example.com with your domain. Install in /etc/nginx/sites-available/.
server {
    listen 80;
    server_name example.com;
    client_max_body_size 1m;
    server_tokens off;
    access_log off;
    error_log /var/log/nginx/personal-shopper-error.log warn;
    gzip on;
    gzip_min_length 512;
    gzip_types text/css application/json application/xml;

    location /static/ {
        alias /opt/personal-shopper/app/static/;
        expires 1h;
        add_header X-Content-Type-Options nosniff always;
    }
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }
}
